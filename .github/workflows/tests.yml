name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        
        # 1. Show the directory structure (to make sure we are in the right place)
        ls -R
        
        # 2. Print requirements.txt with "visible" line endings ($ for newline)
        echo "--- START FILE CONTENT ---"
        cat -e requirements.txt
        echo "--- END FILE CONTENT ---"
        
        # 3. Force install without cache
        pip install --no-cache-dir -r requirements.txt
        
        # 4. Final check
        pip list | grep gradio

    - name: Run Pytest
      run: |
        pytest tests/ -v